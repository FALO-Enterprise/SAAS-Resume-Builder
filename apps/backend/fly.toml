app = "resumax-backend"
primary_region = "iad" # Keep identical to your DB region

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy --schema src/prisma/schema.prisma"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "20s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
