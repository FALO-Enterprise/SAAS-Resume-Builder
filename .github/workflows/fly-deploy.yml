name: Deploy to Fly.io via GitHub Container Registry

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run monorepo type-check
        run: npm run type-check

  deploy-backend:
    name: Build & Deploy Backend Container
    needs: verify
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/resumax-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/resumax-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          flyctl deploy \
            --config apps/backend/fly.toml \
            --image ghcr.io/${{ steps.repo_owner.outputs.owner }}/resumax-backend:${{ github.sha }}

  deploy-frontend:
    name: Build & Deploy Frontend Container
    needs: [verify, deploy-backend]
    if: always() && (needs.verify.result == 'success') && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'frontend')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/resumax-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/resumax-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || secrets.NEXT_PUBLIC_BACKEND_URL || 'https://resumax-backend.fly.dev' }}
            NEXT_PUBLIC_PADDLE_ENVIRONMENT=${{ vars.NEXT_PUBLIC_PADDLE_ENVIRONMENT || secrets.NEXT_PUBLIC_PADDLE_ENVIRONMENT || 'sandbox' }}
            NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${{ vars.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN || secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN || 'test_1831b5d634d7240f9e12e0da9f3' }}
            NEXT_PUBLIC_PADDLE_PRICE_PRO=${{ vars.NEXT_PUBLIC_PADDLE_PRICE_PRO || secrets.NEXT_PUBLIC_PADDLE_PRICE_PRO || 'pri_01m07y484qgcty13yqbfp3gn7e' }}
            NEXT_PUBLIC_PADDLE_PRICE_ENTERPRISE=${{ vars.NEXT_PUBLIC_PADDLE_PRICE_ENTERPRISE || secrets.NEXT_PUBLIC_PADDLE_PRICE_ENTERPRISE || 'pri_01m07y6yt5zcqpp5a45vfgdj85' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          flyctl deploy \
            --config apps/frontend/fly.toml \
            --image ghcr.io/${{ steps.repo_owner.outputs.owner }}/resumax-frontend:${{ github.sha }}
